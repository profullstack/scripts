# Publish a release when a v-tag is pushed.
#
# What a release means in this repo: install.sh and scripts-upgrade resolve the
# newest `v*` tag on the remote and check the tree out at it. So the TAG is the
# artifact — there is deliberately no tarball attached here, because nothing
# would ever download it. The clone is over SSH against a private repo.
#
# The gate below is the point of doing this in CI rather than by hand. Every
# tool here is a script with no build step, so the failure mode is a syntax
# error reaching PATH on every box at once the next time someone upgrades.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script
        run: |
          set -euo pipefail
          rc=0
          for f in bin/* install.sh; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" || rc=1 ;;
              *node*) node --check "$f" || rc=1 ;;
              *sh*)   sh   -n "$f" || rc=1 ;;
              *)      echo "no shebang, skipping: $f" ;;
            esac
          done
          exit $rc

      - name: Every tool in bin/ is executable
        run: |
          set -euo pipefail
          rc=0
          for f in bin/*; do
            [ -f "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "not executable (install.sh will skip it): $f"
              rc=1
            fi
          done
          exit $rc

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Shell files only, chosen by shebang. bin/ is mixed: domainjson is
          # Node, and pointing shellcheck at it produces a screenful of SC1127
          # "was this intended as a comment?" against perfectly good JS.
          files=$(for f in install.sh bin/*; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in *bash*|*/sh|*"env sh"*|*dash*) echo "$f" ;; esac
          done)
          # A loop rather than an unquoted $files: word-splitting a newline
          # list is the sort of thing that behaves differently in the next
          # shell someone runs this in.
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "checking $f"
            # Only hard errors fail a release; style warnings on hand-written
            # tools are noise, and a blocked release is worse than a nitpick.
            shellcheck -S error "$f" || rc=1
          done <<< "$files"
          exit $rc

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes
